# Netlify config — https://docs.netlify.com/configure-builds/file-based-configuration/
#
# Base directory: this file lives in frontend/, and Netlify is told to use
# "frontend" as the base directory when you create the site.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # NEXT_PUBLIC_* values are inlined at build time, so they must be set here
  # (or in the Netlify UI under Site settings → Environment).
  NEXT_PUBLIC_API_URL = "http://localhost:8000"
  NEXT_PUBLIC_SITE_URL = "http://localhost:3000"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------- security --
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Hashed Next.js assets never change.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ---------------------------------------------------------------- redirects --
# Legacy/short slugs → the canonical landing pages (keyword backlinks).
[[redirects]]
  from = "/ig-downloader"
  to = "/instagram-downloader"
  status = 301
  force = true

[[redirects]]
  from = "/yt-downloader"
  to = "/youtube-downloader"
  status = 301
  force = true

[[redirects]]
  from = "/tt-downloader"
  to = "/tiktok-downloader"
  status = 301
  force = true

[[redirects]]
  from = "/video-downloader"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/download"
  to = "/"
  status = 301
  force = true